name: WhatsApp group post

# Vercel's Hobby plan only allows a Cron Job to run once a day, so GitHub
# Actions' free scheduler triggers it instead.
#
# This posts to Lucas's wholesale group (pharmacy/medicine store/clinic
# owners) 3 times a day, real stock only, no fabricated content.
#
# Monrovia, Liberia has no daylight saving and is UTC+0, so these UTC times
# are also the real local times: 9:00 AM (pharmacy opens), 1:00 PM (midday),
# 5:00 PM (pharmacy closes), per Lucas.
#
# SETUP — add this repo secret (Settings → Secrets and variables → Actions):
#   GROUP_POST_SECRET = <same value as GROUP_POST_SECRET in Vercel>

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 Monrovia — morning (opening)
    - cron: '0 13 * * *'  # 13:00 Monrovia — midday
    - cron: '0 17 * * *'  # 17:00 Monrovia — closing
  workflow_dispatch:
    inputs:
      slot:
        description: 'Which slot to post (morning/midday/closing)'
        required: true
        default: 'morning'

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Determine slot
        id: slot
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              '0 9 * * *')  echo "slot=morning" >> "$GITHUB_OUTPUT" ;;
              '0 13 * * *') echo "slot=midday" >> "$GITHUB_OUTPUT" ;;
              '0 17 * * *') echo "slot=closing" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Call post-group-update endpoint
        run: |
          curl -sf -X POST "https://www.ducor-international-pharmacy.com/api/cron/post-group-update" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.GROUP_POST_SECRET }}" \
            -d "{\"slot\":\"${{ steps.slot.outputs.slot }}\"}"
